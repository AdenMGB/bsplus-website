name = "bs-website"
main = ".output/server/index.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "betterseqta.org", custom_domain = true }
]

[dev]
ip = "localhost"
port = 8787

[assets]
directory = ".output/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "bsplus-db"
database_id = "3a1fcbca-3a5c-4407-b61f-68892e8dfed0"
migrations_dir = "server/database/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bsplus-images"

[ai]
binding = "bs-ai"

# Development Environment (dev.betterseqta.org)
[env.dev]
routes = [
  { pattern = "dev.betterseqta.org", custom_domain = true }
]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "bsplus-db"
database_id = "3a1fcbca-3a5c-4407-b61f-68892e8dfed0"
migrations_dir = "server/database/migrations"

[[env.dev.r2_buckets]]
binding = "BUCKET"
bucket_name = "bsplus-images"

[env.dev.ai]
binding = "bs-ai"

# Cron Triggers — must match nuxt.config nitro.scheduledTasks
[triggers]
crons = ["0 2 * * *", "*/30 * * * *"]  # Daily 02:00 UTC + every 30 min interop sync