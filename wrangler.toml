name = "bs-website"
main = ".output/server/index.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "betterseqta.org", custom_domain = true }
]

[dev]
ip = "localhost"
port = 8787

[assets]
directory = ".output/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "bsplus-db"
database_id = "3a1fcbca-3a5c-4407-b61f-68892e8dfed0"

# Custom user-uploaded themes (isolated from main marketplace DB).
# Run: pnpm exec wrangler d1 create bsplus-user-themes-db
# Then replace database_id below with the UUID from that command.
[[d1_databases]]
binding = "USER_THEMES_DB"
database_name = "bsplus-user-themes-db"
database_id = "00000000-0000-0000-0000-user-themes01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bsplus-images"

[ai]
binding = "bs-ai"
remote = true

# Development Environment (dev.betterseqta.org)
[env.dev]
routes = [
  { pattern = "dev.betterseqta.org", custom_domain = true }
]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "bsplus-db"
database_id = "3a1fcbca-3a5c-4407-b61f-68892e8dfed0"

[[env.dev.d1_databases]]
binding = "USER_THEMES_DB"
database_name = "bsplus-user-themes-db"
database_id = "00000000-0000-0000-0000-user-themes01"

[[env.dev.r2_buckets]]
binding = "BUCKET"
bucket_name = "bsplus-images"

[env.dev.ai]
binding = "bs-ai"
remote = true

# Cron Triggers — must match nuxt.config nitro.scheduledTasks
[triggers]
crons = ["0 2 * * *"]  # Daily 02:00 UTC: cleanup + theme stats + admin feedback digest